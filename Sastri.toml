# Install-channel wrappers for the apo executable.
# Secrets are never stored here. Do not generate ci or github_releases:
# those workflows already exist (dogfood, gitleaks, multi-arch release + crates.io).

[project]
name = "apo"
description = "APO — Engineering Evidence Platform. Repository hygiene, knowledge, and AI evidence."
github_owner = "baoulo"
github_repo = "apo"
binary_name = "apo"
version = "0.2.0"
cargo_manifest = "Cargo.toml"
license = "MIT"
homepage = "https://github.com/baoulo/apo"

[org]
homebrew_tap = "baoulo/homebrew-tap"
scoop_bucket = "baoulo/scoop-bucket"
asdf_plugin_repo = "baoulo/asdf-apo"

[mechanisms]
ci = false
github_releases = false
install_sh = true
homebrew = true
scoop = true
asdf = true
mise = true
setup_action = true
npm = false
pypi = false
hex = false
ruby_gem = false
haskell_cabal = false

[release]
platforms = [
  "linux-x86_64",
  "linux-aarch64",
  "macos-aarch64",
  "macos-x86_64",
  "windows-x86_64",
]
publish_crates_io = true
publish_sha256sums = true

[paths]
packaging_dir = "packaging"
scripts_dir = "scripts"
workflows_dir = ".github/workflows"
actions_dir = ".github/actions"
