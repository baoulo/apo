# https://github.com/probot/settings — policy-as-code for branch protection
# Apply with the Settings app or mirror these rules in the GitHub UI.

repository:
  name: apo
  default_branch: main
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: true
  delete_branch_on_merge: true

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
      required_status_checks:
        strict: true
        contexts:
          - Format
          - Docs
          - Secret scanning
          - Clippy
          - "Test (ubuntu-latest)"
          - Coverage
          - Security audit
          - APO self-analysis
      enforce_admins: false
      restrictions: null
