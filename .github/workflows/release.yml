name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            bin: apo
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            bin: apo
          - platform: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            bin: apo
          - platform: macos-x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            bin: apo
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin: apo.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if rustup toolchain install stable --target "${{ matrix.target }}"; then
              rustup default stable
              exit 0
            fi
            echo "rustup download failed (attempt ${attempt}/5), retrying in 15s..."
            sleep 15
          done
          echo "rustup failed after 5 attempts"
          exit 1

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="apo-${VERSION}-${{ matrix.platform }}.tar.gz"
          cd "target/${{ matrix.target }}/release"
          tar -czf "${ARCHIVE}" "${{ matrix.bin }}"
          mv "${ARCHIVE}" "${GITHUB_WORKSPACE}/"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="apo-${VERSION}-${{ matrix.platform }}.zip"
          cd "target/${{ matrix.target }}/release"
          7z a "${ARCHIVE}" "${{ matrix.bin }}"
          mv "${ARCHIVE}" "${GITHUB_WORKSPACE}/"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: apo-${{ github.ref_name }}-${{ matrix.platform }}.${{ matrix.archive }}
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          shopt -s nullglob
          sha256sum apo-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*

  update-packaging:
    name: Update packaging checksums
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Fine-grained PAT (Contents: read/write) so packaging commits can land on main.
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}
      - name: Fill Homebrew and Scoop hashes from SHA256SUMS
        run: |
          set -euo pipefail
          chmod +x scripts/update-packaging-checksums.sh
          # Download the sums attached to this tag's GitHub Release (created by the previous job).
          for attempt in 1 2 3 4 5; do
            if scripts/update-packaging-checksums.sh "${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "SHA256SUMS not ready yet (attempt ${attempt}/5), retrying in 10s..."
            sleep 10
          done
          echo "Failed to apply packaging checksums from ${GITHUB_REF_NAME}"
          exit 1
      - name: Commit packaging updates to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/homebrew/apo.rb packaging/scoop/apo.json
          if git diff --staged --quiet; then
            echo "Packaging files already up to date"
            exit 0
          fi
          git commit -m "chore: packaging checksums for ${GITHUB_REF_NAME}"
          git push origin HEAD:main

  verify-install:
    name: Verify install (${{ matrix.os }})
    needs: update-packaging
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # Packaging job pushed filled Homebrew/Scoop hashes to main.
          ref: main
      - name: Install via scripts/install.sh
        shell: bash
        env:
          APO_VERSION: ${{ github.ref_name }}
          APO_INSTALL_DIR: ${{ runner.temp }}/apo-bin
        run: |
          set -euo pipefail
          expect="${GITHUB_REF_NAME#v}"
          chmod +x scripts/install.sh
          for attempt in 1 2 3 4 5; do
            if sh scripts/install.sh; then
              break
            fi
            echo "install.sh failed (attempt ${attempt}/5), retrying in 10s..."
            sleep 10
            if [[ "${attempt}" -eq 5 ]]; then
              exit 1
            fi
          done
          "${APO_INSTALL_DIR}/apo" --version
          "${APO_INSTALL_DIR}/apo" --version | grep -F "${expect}"
      - name: Install via Homebrew formula
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          expect="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            if brew install --formula ./packaging/homebrew/apo.rb; then
              break
            fi
            echo "brew install failed (attempt ${attempt}/5), retrying in 15s..."
            sleep 15
            if [[ "${attempt}" -eq 5 ]]; then
              exit 1
            fi
          done
          apo --version
          apo --version | grep -F "${expect}"

  publish-crates-io:
    name: Publish to crates.io
    needs: verify-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "${CARGO_REGISTRY_TOKEN}" ]]; then
            echo "CARGO_REGISTRY_TOKEN secret is not set; skipping crates.io publish"
            exit 1
          fi
          cargo publish --token "${CARGO_REGISTRY_TOKEN}"
