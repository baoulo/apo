  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <text aria-hidden="true" x="120.0" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="130">ai</text>
    <text x="120.0" y="140" transform="scale(.1)" textLength="130">ai</text>
    <text aria-hidden="true" x="485.0" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="390">95/100</text>
