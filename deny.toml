# cargo-deny configuration for APO.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "LGPL-2.1-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# Transitive duplicates we cannot unify without forking upstream crates.
[[bans.skip]]
name = "hashbrown"
reason = "clru (gix-pack) pins 0.16; gix-hashtable / indexmap use 0.17"

[[bans.skip]]
name = "syn"
reason = "serde_derive / thiserror-impl use syn 3; clap / tracing / gix still on syn 2"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
